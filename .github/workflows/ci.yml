name: workspace CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: workspace-monorepo
          persist-credentials: false

      # zed-cli path-depends on ../zed-interfaces, so they must be siblings.
      - name: Check out zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-cli
          path: zed-cli
          persist-credentials: false
      - name: Check out zed-interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: workspace-monorepo/.github/workflows/ci.yml

      - name: Every member glob resolves to a directory with its own manifest
        working-directory: workspace-monorepo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          root = Path(".")
          with (root / ".zpkg.toml").open("rb") as handle:
              manifest = tomllib.load(handle)

          patterns = manifest["workspace"]["members"]
          assert patterns == ["packages/*", "apps/*"], patterns

          found = {}
          for pattern in patterns:
              for directory in sorted(root.glob(pattern)):
                  assert directory.is_dir(), directory
                  member_manifest = directory / ".zpkg.toml"
                  # Unlike a [targets] dir, a workspace member MUST carry its own
                  # manifest -- that is what makes it a separate package.
                  assert member_manifest.exists(), f"{directory}: no .zpkg.toml"
                  with member_manifest.open("rb") as handle:
                      package = tomllib.load(handle)["package"]
                  found[f"{package['org']}/{package['name']}"] = directory

          assert set(found) == {
              "zedtest/ws-core",
              "zedtest/ws-utils",
              "zedtest/ws-cli",
          }, sorted(found)
          print("members:", sorted(found))
          PY

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6
        with:
          node-version: 22

      - name: Build the zed CLI
        run: cargo build --release --bin zed --manifest-path zed-cli/Cargo.toml

      - name: Members resolve by path, transitively, with no registry
        working-directory: workspace-monorepo/apps/cli
        shell: bash
        run: |
          set -euo pipefail
          ZED="$GITHUB_WORKSPACE/zed-cli/target/release/zed"
          echo "ZED=$ZED" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/empty-reg"
          sha256sum .zpkg.toml > "$RUNNER_TEMP/workspace-manifest.sha256"

          # Deliberately an EMPTY registry: if anything resolves through it
          # rather than through the workspace, this step fails.
          "$ZED" install --registry "file://$RUNNER_TEMP/empty-reg" \
            --home "$RUNNER_TEMP/home" 2>&1 | tee "$RUNNER_TEMP/install.log"
          sha256sum .zpkg.lock > "$RUNNER_TEMP/workspace-lock.sha256"

          # ws-cli depends on ws-utils only; ws-core arrives transitively.
          grep -q 'installed zedtest/ws-core@workspace' "$RUNNER_TEMP/install.log"
          grep -q 'installed zedtest/ws-utils@workspace' "$RUNNER_TEMP/install.log"

          # The @workspace version and the symlink target are the proof of a
          # path link rather than a registry download.
          test -L zed_modules/zedtest/ws-core
          test -L zed_modules/zedtest/ws-utils
          test "$(readlink zed_modules/zedtest/ws-core)" \
             = "$GITHUB_WORKSPACE/workspace-monorepo/packages/core"
          test "$(readlink zed_modules/zedtest/ws-utils)" \
             = "$GITHUB_WORKSPACE/workspace-monorepo/packages/utils"

      - name: Workspace adapters emit package paths and consumer-local Node links
        working-directory: workspace-monorepo/apps/cli
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path(".zed/paths.json").read_text(encoding="utf-8"))
          assert index["modules_dir"] == "zed_modules", index
          actual = {
              entry["package"]: (entry["version"], entry["path"])
              for entry in index["packages"]
          }
          assert actual == {
              "zedtest/ws-core": ("workspace", "zed_modules/zedtest/ws-core"),
              "zedtest/ws-utils": ("workspace", "zed_modules/zedtest/ws-utils"),
          }, actual
          assert Path(".zed/node_path").read_text(encoding="utf-8").strip() == "zed_modules"
          PY

          test -L node_modules/@zedtest/ws-core
          test -L node_modules/@zedtest/ws-utils
          test "$(readlink node_modules/@zedtest/ws-core)" \
             = "$GITHUB_WORKSPACE/workspace-monorepo/packages/core"
          test "$(readlink node_modules/@zedtest/ws-utils)" \
             = "$GITHUB_WORKSPACE/workspace-monorepo/packages/utils"

      - name: REMAINING GAP - transitive Node lookup follows the member realpath
        working-directory: workspace-monorepo/apps/cli
        shell: bash
        run: |
          set -euo pipefail
          # The adapter now emits consumer-local Node links and paths.json, but
          # Node resolves ws-utils through its real path under packages/utils.
          # Its transitive ws-core import therefore searches upward from the
          # workspace member and still requires workspace-root wiring.
          #
          # When root-aware wiring lands, THIS STEP SHOULD FAIL so the fixture
          # is updated to assert the zero-touch success path instead.
          if node bin/cli.js > "$RUNNER_TEMP/consumer-local.log" 2>&1; then
            echo "::error::transitive workspace Node wiring now resolves without root hoisting"
            exit 1
          fi
          grep -q "Cannot find module '@zedtest/ws-core'" "$RUNNER_TEMP/consumer-local.log"
          if grep -q "Cannot find module '@zedtest/ws-utils'" "$RUNNER_TEMP/consumer-local.log"; then
            echo "::error::the direct consumer-local ws-utils link did not resolve"
            exit 1
          fi

      - name: Uninstall removes all workspace projections and retains authority files
        working-directory: workspace-monorepo/apps/cli
        shell: bash
        run: |
          set -euo pipefail
          "$ZED" uninstall --registry "file://$RUNNER_TEMP/empty-reg" \
            --home "$RUNNER_TEMP/home" 2>&1 | tee "$RUNNER_TEMP/uninstall.log"

          grep -q 'uninstalled zedtest/ws-core' "$RUNNER_TEMP/uninstall.log"
          grep -q 'uninstalled zedtest/ws-utils' "$RUNNER_TEMP/uninstall.log"
          grep -q '0 package(s) remain materialized' "$RUNNER_TEMP/uninstall.log"
          sha256sum --check "$RUNNER_TEMP/workspace-manifest.sha256"
          sha256sum --check "$RUNNER_TEMP/workspace-lock.sha256"

          test ! -e zed_modules
          test ! -e node_modules/@zedtest/ws-core
          test ! -e node_modules/@zedtest/ws-utils
          test ! -e .zed/paths.json
          test ! -e .zed/node_path

          if node bin/cli.js > "$RUNNER_TEMP/uninstalled.log" 2>&1; then
            echo "::error::workspace CLI still resolved after full uninstall"
            exit 1
          fi
          grep -q "Cannot find module '@zedtest/ws-utils'" "$RUNNER_TEMP/uninstalled.log"

      - name: Frozen reinstall restores the exact workspace graph and adapters
        working-directory: workspace-monorepo/apps/cli
        shell: bash
        run: |
          set -euo pipefail
          "$ZED" install --frozen --registry "file://$RUNNER_TEMP/empty-reg" \
            --home "$RUNNER_TEMP/home" 2>&1 | tee "$RUNNER_TEMP/frozen-restore.log"

          grep -q 'installed zedtest/ws-core@workspace' "$RUNNER_TEMP/frozen-restore.log"
          grep -q 'installed zedtest/ws-utils@workspace' "$RUNNER_TEMP/frozen-restore.log"
          sha256sum --check "$RUNNER_TEMP/workspace-manifest.sha256"
          sha256sum --check "$RUNNER_TEMP/workspace-lock.sha256"

          test -L zed_modules/zedtest/ws-core
          test -L zed_modules/zedtest/ws-utils
          test -L node_modules/@zedtest/ws-core
          test -L node_modules/@zedtest/ws-utils
          test "$(cat .zed/node_path)" = "zed_modules"
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path(".zed/paths.json").read_text(encoding="utf-8"))
          assert {entry["package"] for entry in index["packages"]} == {
              "zedtest/ws-core",
              "zedtest/ws-utils",
          }, index
          assert all(entry["version"] == "workspace" for entry in index["packages"])
          PY

          if node bin/cli.js > "$RUNNER_TEMP/frozen-consumer-local.log" 2>&1; then
            echo "::error::root-aware Node wiring landed; update the remaining-gap assertion"
            exit 1
          fi
          grep -q "Cannot find module '@zedtest/ws-core'" \
            "$RUNNER_TEMP/frozen-consumer-local.log"

      - name: Workspace-root Node wiring completes the two-hop chain
        working-directory: workspace-monorepo
        shell: bash
        run: |
          set -euo pipefail
          # Root hoisting is the remaining adapter requirement because Node
          # searches upward from the symlinked member's real path.
          mkdir -p node_modules/@zedtest
          ln -sfn ../../packages/core node_modules/@zedtest/ws-core
          ln -sfn ../../packages/utils node_modules/@zedtest/ws-utils
          node apps/cli/bin/cli.js | tee "$RUNNER_TEMP/root-wired.log"
          grep -q 'OK: member -> member -> member resolved by path' \
            "$RUNNER_TEMP/root-wired.log"

      - name: Upload install diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-install-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
